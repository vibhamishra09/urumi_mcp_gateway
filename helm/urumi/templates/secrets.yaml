{{- $ns := .Release.Namespace }}
---
# MariaDB credentials
apiVersion: v1
kind: Secret
metadata:
  name: urumi-db-secret
  namespace: {{ $ns }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-password: {{ .Values.secrets.mariadbRootPassword | quote }}
  user-password: {{ .Values.secrets.mariadbUserPassword | quote }}
---
# Gateway and PostgreSQL credentials
apiVersion: v1
kind: Secret
metadata:
  name: urumi-gateway-secret
  namespace: {{ $ns }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ .Values.secrets.postgresPassword | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  admin-password: {{ .Values.secrets.adminPassword | quote }}
---
# WooCommerce REST API credentials
apiVersion: v1
kind: Secret
metadata:
  name: urumi-woocommerce-secret
  namespace: {{ $ns }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
type: Opaque
stringData:
  consumer-key: {{ .Values.secrets.wcConsumerKey | quote }}
  consumer-secret: {{ .Values.secrets.wcConsumerSecret | quote }}
---
# Gemini API key
apiVersion: v1
kind: Secret
metadata:
  name: urumi-gemini-secret
  namespace: {{ $ns }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.secrets.geminiApiKey | quote }}
