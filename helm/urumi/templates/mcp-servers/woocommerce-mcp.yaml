{{- if .Values.woocommerceMcp.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woocommerce-mcp
  namespace: {{ .Release.Namespace }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
    app: woocommerce-mcp
spec:
  replicas: {{ .Values.woocommerceMcp.replicaCount }}
  selector:
    matchLabels:
      app: woocommerce-mcp
  template:
    metadata:
      labels:
        app: woocommerce-mcp
    spec:
      containers:
      - name: woocommerce-mcp
        image: {{ .Values.woocommerceMcp.image.repository }}:{{ .Values.woocommerceMcp.image.tag }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.woocommerceMcp.port }}
          name: mcp
        env:
        - name: PORT
          value: {{ .Values.woocommerceMcp.port | quote }}
        - name: WC_URL
          value: "http://woocommerce"
        - name: WC_CONSUMER_KEY
          valueFrom:
            secretKeyRef:
              name: urumi-woocommerce-secret
              key: consumer-key
        - name: WC_CONSUMER_SECRET
          valueFrom:
            secretKeyRef:
              name: urumi-woocommerce-secret
              key: consumer-secret
        resources: {{- toYaml .Values.woocommerceMcp.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.woocommerceMcp.port }}
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.woocommerceMcp.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: woocommerce-mcp
  namespace: {{ .Release.Namespace }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
spec:
  selector:
    app: woocommerce-mcp
  ports:
  - port: {{ .Values.woocommerceMcp.port }}
    targetPort: {{ .Values.woocommerceMcp.port }}
    name: mcp
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: woocommerce-mcp-netpol
  namespace: {{ .Release.Namespace }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: woocommerce-mcp
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: gateway-backend
    ports:
    - protocol: TCP
      port: {{ .Values.woocommerceMcp.port }}
{{- end }}
