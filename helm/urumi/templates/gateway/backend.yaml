{{- if .Values.gatewayBackend.enabled }}
---
# DB migration Job — runs before the main deployment
apiVersion: batch/v1
kind: Job
metadata:
  name: gateway-migrate-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-pg
        image: busybox:1.36
        command: [sh, -c, "until nc -z postgresql 5432; do sleep 2; done"]
      containers:
      - name: migrate
        image: {{ .Values.gatewayBackend.image.repository }}:{{ .Values.gatewayBackend.image.tag }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command: [node, src/db/migrate.js]
        env:
        - name: DB_HOST
          value: postgresql
        - name: DB_NAME
          value: {{ .Values.postgresql.auth.database }}
        - name: DB_USER
          value: {{ .Values.postgresql.auth.username }}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: urumi-gateway-secret
              key: db-password
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: urumi-gateway-secret
              key: admin-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-backend
  namespace: {{ .Release.Namespace }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
    app: gateway-backend
spec:
  replicas: {{ .Values.gatewayBackend.replicaCount }}
  selector:
    matchLabels:
      app: gateway-backend
  template:
    metadata:
      labels:
        app: gateway-backend
    spec:
      initContainers:
      - name: wait-for-pg
        image: busybox:1.36
        command: [sh, -c, "until nc -z postgresql 5432; do sleep 2; done"]
      containers:
      - name: gateway-backend
        image: {{ .Values.gatewayBackend.image.repository }}:{{ .Values.gatewayBackend.image.tag }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.gatewayBackend.port }}
          name: http
        env:
        - name: PORT
          value: {{ .Values.gatewayBackend.port | quote }}
        - name: DB_HOST
          value: postgresql
        - name: DB_NAME
          value: {{ .Values.postgresql.auth.database }}
        - name: DB_USER
          value: {{ .Values.postgresql.auth.username }}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: urumi-gateway-secret
              key: db-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: urumi-gateway-secret
              key: jwt-secret
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: urumi-gemini-secret
              key: api-key
        - name: UPSTREAM_TIMEOUT_MS
          value: {{ .Values.gatewayBackend.config.upstreamTimeoutMs | quote }}
        - name: CORS_ORIGIN
          value: {{ .Values.gatewayBackend.config.corsOrigin | quote }}
        resources: {{- toYaml .Values.gatewayBackend.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.gatewayBackend.port }}
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.gatewayBackend.port }}
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-backend
  namespace: {{ .Release.Namespace }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
spec:
  selector:
    app: gateway-backend
  ports:
  - port: 4000
    targetPort: {{ .Values.gatewayBackend.port }}
    name: http
{{- end }}
