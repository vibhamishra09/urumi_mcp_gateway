server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy to gateway backend
    location /api/ {
        proxy_pass http://gateway-backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /mcp {
        proxy_pass http://gateway-backend:4000/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://gateway-backend:4000/health;
    }

    # SPA routing — serve index.html for all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
